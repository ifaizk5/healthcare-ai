version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: healthlens_postgres
    environment:
      POSTGRES_DB: healthlens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.5.0
    container_name: healthlens_mlflow
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlruns --host 0.0.0.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: healthlens_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/healthlens
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - SAMPLE_DATA_DIR=/sample_data
      - CONFIGS_DIR=/configs
    volumes:
      - ./sample_data:/sample_data:ro
      - ./configs:/configs:ro
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mlflow

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: healthlens_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
